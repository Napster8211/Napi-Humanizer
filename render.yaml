services:
  - type: web
    name: napi-humanizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL_PRIMARY
        value: openrouter/free
      - key: LLM_MODEL_FALLBACKS
        value: ""
      - key: LLM_ALLOW_FREE_ROUTER
        value: "true"
      - key: LLM_TIMEOUT_MS
        value: "45000"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: MAX_WORDS_PER_RUN
        value: "500"
      - key: MAX_INPUT_CHARS
        value: "15000"
      - key: LOG_RAW_USER_TEXT
        value: "false"
