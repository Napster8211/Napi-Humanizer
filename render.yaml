services:
  - type: web
    name: napi-humanizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4.6
      - key: MAX_INPUT_CHARS
        value: "15000"
      - key: LOG_RAW_USER_TEXT
        value: "false"
